version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: selfcare
      POSTGRES_USER: selfcare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfcare"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://selfcare:${POSTGRES_PASSWORD:-devpassword}@db:5432/selfcare?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
