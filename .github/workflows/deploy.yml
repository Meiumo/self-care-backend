name: Deploy

on:
  push:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/meiumo/self-care-backend/api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.IMAGE }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u meiumo --password-stdin

      - name: Pull and restart
        env:
          APP_ENV: ${{ vars.APP_ENV || 'production' }}
        run: |
          cd /opt/selfcare/backend
          # Sync APP_ENV from GitHub repository variable into .env
          if grep -q "^APP_ENV=" .env 2>/dev/null; then
            sed -i "s/^APP_ENV=.*/APP_ENV=${APP_ENV}/" .env
          else
            echo "APP_ENV=${APP_ENV}" >> .env
          fi
          docker compose pull api
          docker compose up -d
